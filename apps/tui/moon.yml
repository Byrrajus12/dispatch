$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'tui'

language: 'typescript'
layer: 'application'

tasks:
  # Runs from source under Bun (OpenTUI's native core loads through bun:ffi);
  # `dispatch tui` resolves the daemon and spawns this entry.
  start:
    command: 'bun run src/main.tsx'
    options:
      cache: false
      interactive: true
      runInCI: 'skip'
